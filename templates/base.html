<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{var m=localStorage.getItem("theme");if(m)document.documentElement.dataset.theme=m}catch(e){}</script>
<title>$title</title>
<meta name="description" content="$description">
<link rel="canonical" href="$canonical">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:type" content="website">
<meta property="og:url" content="$canonical">
<meta name="twitter:card" content="summary">
$alternates
<style>
/* Design tokens. Light and dark are authored as separate palettes rather than
   inverted values, so contrast is verified per theme instead of assumed. */
:root{
  --bg:#ffffff; --surface:#f7f8fa; --fg:#16181d; --muted:#5c6370;
  --line:#e4e7eb; --line-strong:#d2d7dd;
  --up:#0a7c42; --up-bg:#e8f5ee; --down:#9a3412; --down-bg:#fdeee7;
  --link:#0b56c4; --focus:#0b56c4;
  /* 4px spacing rhythm */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --radius:8px;
  /* Tile lightness lives per theme so a hashed hue can never drive contrast.
     Verified across all hues: worst case 13.8:1 light, 7.0:1 dark. */
  --tile-l:92%;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --surface:#161b22; --fg:#e6edf3; --muted:#8b949e;
    --line:#21262d; --line-strong:#30363d;
    --up:#3fb950; --up-bg:#0f2a17; --down:#f0883e; --down-bg:#2b1a0f;
    --link:#6cb6ff; --focus:#6cb6ff;
    --tile-l:22%;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b22; --fg:#e6edf3; --muted:#8b949e;
  --line:#21262d; --line-strong:#30363d;
  --up:#3fb950; --up-bg:#0f2a17; --down:#f0883e; --down-bg:#2b1a0f;
  --link:#6cb6ff; --focus:#6cb6ff;
  --tile-l:22%;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* Every figure on this site sits in a column that must not jitter as digits change. */
  font-variant-numeric:tabular-nums;
}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

.skip{position:absolute;left:-9999px}
.skip:focus{left:var(--s4);top:var(--s2);z-index:10;padding:var(--s2) var(--s3);
  background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--radius)}

.wrap{max-width:60rem;margin:0 auto;padding:0 var(--s4)}

header{border-bottom:1px solid var(--line);background:var(--bg)}
.head-inner{display:flex;gap:var(--s5);align-items:center;flex-wrap:wrap;
  padding-top:var(--s4);padding-bottom:var(--s4)}
.brand{font-size:17px;font-weight:650;letter-spacing:-.01em;text-decoration:none;color:inherit;
  display:inline-flex;align-items:center;gap:var(--s2)}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--up);flex:none}
nav{display:flex;gap:var(--s1);flex-wrap:wrap;margin-left:auto}
nav a{
  font-size:14px;text-decoration:none;color:var(--muted);
  /* 44px min touch target via padding, not a fixed height that breaks wrapping. */
  padding:var(--s3) var(--s3);border-radius:6px;transition:background .15s,color .15s;
}
nav a:hover{color:var(--fg);background:var(--surface)}
nav a[aria-current=page]{color:var(--fg);font-weight:600;background:var(--surface)}
.langs{display:flex;gap:2px;align-items:center;border:1px solid var(--line-strong);
  border-radius:6px;padding:2px;margin-left:var(--s2)}
.langs a{font-size:13px;padding:var(--s2) var(--s3);border-radius:4px;text-decoration:none;
  color:var(--muted);line-height:1}
.langs a:hover{color:var(--fg);background:var(--surface)}
.langs a[aria-current=true]{color:var(--fg);background:var(--surface);font-weight:600}
.theme-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;margin-left:var(--s2);padding:0;
  border:1px solid var(--line-strong);border-radius:6px;
  background:var(--bg);color:var(--muted);cursor:pointer;
  transition:color .15s,background .15s;
}
.theme-btn:hover{color:var(--fg);background:var(--surface)}
.theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .moon{display:block}
:root[data-theme="dark"] .theme-btn .sun{display:none}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-btn .moon{display:block}
  :root:not([data-theme="light"]) .theme-btn .sun{display:none}
}

main{padding-top:var(--s6);padding-bottom:var(--s7)}
h1{font-size:28px;line-height:1.25;letter-spacing:-.02em;margin:0 0 var(--s2);font-weight:680}
h2{font-size:21px;line-height:1.3;letter-spacing:-.01em;margin:var(--s7) 0 var(--s4);font-weight:650}
h2:first-child{margin-top:0}
.lede{color:var(--muted);font-size:17px;margin:0 0 var(--s6);max-width:46rem}
p{max-width:46rem}

/* ---- repo card: rank, identity, momentum ---- */
.card{
  display:grid;grid-template-columns:auto 1fr auto;gap:var(--s4);
  padding:var(--s4) 0;border-bottom:1px solid var(--line);align-items:start;
}
/* Decorative scanning anchor: the owner name sits next to it as text, so the
   tile is aria-hidden and carries no information of its own. */
.card-avatar{
  width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
  font-size:15px;font-weight:650;color:var(--fg);margin-top:1px;
  font-variant-numeric:normal;
}
.card-rank{
  grid-row:span 2;font-size:13px;color:var(--muted);font-weight:600;
  min-width:2ch;padding-top:3px;
}
.card:has(.card-rank){grid-template-columns:auto auto 1fr auto}
.card-title{font-size:17px;line-height:1.35;margin:0 0 var(--s1);font-weight:600}
.card-title a{text-decoration:none}
.card-title a:hover{text-decoration:underline}
.card-title .owner{color:var(--muted);font-weight:450}
.card-desc{margin:0 0 var(--s2);color:var(--fg);font-size:15px;line-height:1.5;
  max-width:44rem}
.card-meta{display:flex;gap:var(--s4);flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.card-meta a{color:var(--muted)}

/* Momentum block: the product's differentiator, so it gets the largest number
   on the card and its own column rather than trailing the metadata row. */
.momentum{text-align:right;min-width:8.5rem}
.mom-value{
  display:inline-flex;align-items:center;gap:var(--s1);
  font-size:19px;font-weight:670;letter-spacing:-.01em;line-height:1.2;
  padding:var(--s1) var(--s2);border-radius:6px;
}
.mom-value svg{flex:none}
.mom-up{color:var(--up);background:var(--up-bg)}
.mom-down{color:var(--down);background:var(--down-bg)}
.mom-none{color:var(--muted);font-weight:500;font-size:15px}
.mom-sub{display:block;color:var(--muted);font-size:12.5px;margin-top:var(--s1)}

.tags{margin-top:var(--s2);display:flex;flex-wrap:wrap;gap:var(--s1)}
.tags a{
  font-size:12.5px;text-decoration:none;color:var(--muted);
  padding:3px var(--s2);border:1px solid var(--line-strong);border-radius:999px;
  transition:border-color .15s,color .15s;
}
.tags a:hover{color:var(--fg);border-color:var(--fg)}

/* ---- board: dense comparison table ----
   Cards cost ~1KB a row and show one window; a row costs ~280 bytes and shows
   every window at once, which is what makes "who is hot" answerable at a glance. */
.board-wrap{overflow-x:auto;margin:0 -1rem;padding:0 1rem}
.board{border-collapse:collapse;width:100%;font-size:14px;min-width:44rem}
.board th{
  text-align:right;font-size:11.5px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;padding:0 0 var(--s2) var(--s4);
  border-bottom:1px solid var(--line-strong);white-space:nowrap;
  position:sticky;top:0;background:var(--bg);
}
/* Sorting lives in the header rather than in separate routes: one click
   re-ranks in place instead of a page load. The per-window routes stay for
   deep links and indexing. */
.board th button{
  font:inherit;color:inherit;background:none;border:0;padding:var(--s2) 0;
  cursor:pointer;display:inline-flex;align-items:center;gap:3px;
  text-transform:inherit;letter-spacing:inherit;
}
.board th button:hover{color:var(--fg)}
.board th[aria-sort] button{color:var(--fg)}
.board th button .arrow{opacity:0;transition:opacity .15s}
.board th[aria-sort] button .arrow{opacity:1}
.board th[aria-sort="ascending"] button .arrow{transform:rotate(180deg)}
.board th.left{text-align:left;padding-left:0}
.board td{padding:var(--s3) 0 var(--s3) var(--s4);border-bottom:1px solid var(--line);
  text-align:right;white-space:nowrap;vertical-align:top}
.board td.left{text-align:left;padding-left:0;white-space:normal;width:100%}
.board tr:hover td{background:var(--surface)}
.board .rank{color:var(--muted);font-size:12.5px;padding-left:0;width:2.5rem;
  text-align:right;padding-right:var(--s3)}
.cell-repo{display:flex;gap:var(--s3);align-items:flex-start}
.cell-repo .card-avatar{width:28px;height:28px;font-size:13px;border-radius:6px;flex:none}
.cell-name{font-weight:600;font-size:14.5px;text-decoration:none;display:block}
.cell-name:hover{text-decoration:underline}
.cell-name .owner{color:var(--muted);font-weight:450}
.cell-desc{display:block;color:var(--muted);font-size:13px;line-height:1.45;
  margin-top:2px;max-width:38rem}
.cell-tags{margin-top:var(--s1);display:flex;gap:var(--s1);flex-wrap:wrap}
.cell-tags a{font-size:11.5px;color:var(--muted);text-decoration:none;
  border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.cell-tags a:hover{color:var(--fg);border-color:var(--fg)}
.pct{font-weight:640;font-variant-numeric:tabular-nums}
.pct-up{color:var(--up)}
.pct-down{color:var(--down)}
.pct-none{color:var(--muted);font-weight:400}
.col-rate{color:var(--muted);font-size:13px}
@media(max-width:760px){
  .board .hide-sm{display:none}
  .board{min-width:26rem}
}

/* ---- notice / empty states ---- */
.notice{
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--muted);
  border-radius:var(--radius);padding:var(--s4);margin:0 0 var(--s5);
}
.notice h3{margin:0 0 var(--s1);font-size:15px;font-weight:650}
.notice p{margin:0;color:var(--muted);font-size:14.5px;max-width:44rem}

/* ---- stat tiles: used instead of a chart below 4 data points ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:var(--s3);
  margin:var(--s4) 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:var(--s3) var(--s4)}
.stat-label{display:block;color:var(--muted);font-size:12.5px;text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:var(--s1)}
.stat-value{font-size:21px;font-weight:660;letter-spacing:-.01em}

.spark{display:block;margin:var(--s3) 0;color:var(--up)}

input[type=search]{
  width:100%;max-width:34rem;padding:var(--s3) var(--s4);font-size:16px;
  border:1px solid var(--line-strong);border-radius:var(--radius);
  background:var(--bg);color:var(--fg);
}
input[type=search]::placeholder{color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;
  text-transform:uppercase;letter-spacing:.04em}
td,th{padding:var(--s3) var(--s4) var(--s3) 0;border-bottom:1px solid var(--line)}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px;
  padding-top:var(--s5);padding-bottom:var(--s6)}
footer p{margin:0 0 var(--s2)}

@media(max-width:640px){
  main{padding-top:var(--s5)}
  h1{font-size:24px}
  h2{font-size:19px;margin-top:var(--s6)}
  /* Momentum drops below the identity block rather than squeezing it; the
     rank and tile stay beside the content so the list is still scannable. */
  .card{grid-template-columns:auto 1fr}
  .card:has(.card-rank){grid-template-columns:auto auto 1fr}
  .card-rank{grid-row:auto}
  .momentum{grid-column:1/-1;text-align:left}
  nav{margin-left:0}
  .langs{margin-left:0}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
$head_extra
</head>
<body>
<a class="skip" href="#main">$skip_label</a>
<header>
<div class="wrap head-inner">
<a class="brand" href="$home_href"><span class="dot" aria-hidden="true"></span>gitpulse</a>
$nav
$lang_switcher
<button class="theme-btn" id="theme-toggle" type="button" aria-label="$theme_label">
<svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
<svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
</button>
</div>
</header>
<main id="main" class="wrap">
$body
</main>
<footer class="wrap">
<p>$footer_data</p>
<p><a href="$methodology_href">$footer_how</a> &middot;
<a href="https://github.com/thaitrn/gitpulse">$footer_source</a></p>
</footer>
<script>
(function(){
  var table=document.querySelector(".board");
  if(!table)return;
  var body=table.tBodies[0];
  table.querySelectorAll("th[data-key] button").forEach(function(btn){
    btn.addEventListener("click",function(){
      var th=btn.parentNode;
      var wasDesc=th.getAttribute("aria-sort")==="descending";
      var dir=wasDesc?1:-1;
      var index=Array.prototype.indexOf.call(th.parentNode.children,th);
      var rows=Array.prototype.slice.call(body.rows);
      rows.sort(function(a,b){
        var x=a.cells[index].dataset.v,y=b.cells[index].dataset.v;
        // Rows without a figure sink to the bottom whichever way we sort.
        if(x==="")return 1;
        if(y==="")return -1;
        return (parseFloat(x)-parseFloat(y))*dir;
      });
      rows.forEach(function(r,i){r.cells[0].textContent=i+1;body.appendChild(r)});
      table.querySelectorAll("th[aria-sort]").forEach(function(o){o.removeAttribute("aria-sort")});
      th.setAttribute("aria-sort",wasDesc?"ascending":"descending");
    });
  });
})();
(function(){
  var b=document.getElementById("theme-toggle");
  if(!b)return;
  b.addEventListener("click",function(){
    var root=document.documentElement;
    var dark=root.dataset.theme?root.dataset.theme==="dark"
             :matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme=dark?"light":"dark";
    try{localStorage.setItem("theme",root.dataset.theme)}catch(e){}
  });
})();
</script>
</body>
</html>
